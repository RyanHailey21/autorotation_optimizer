name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpp:
    name: C++ build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++ cmake ninja-build libnlopt-cxx-dev
      - name: Configure
        run: cmake -S cpp -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Optimize the tracked polar
        run: |
          ./build/autorotation_opt \
            --root . --polar data/aero_polar.csv \
            --trace "${RUNNER_TEMP}/trace.csv" --quiet | tee smoke-output.txt
          grep -q "Optimization status:" smoke-output.txt
          grep -q "induction failed: 0 %" smoke-output.txt
          test -s "${RUNNER_TEMP}/trace.csv"

  python:
    name: Python polar generation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Check Python sources
        run: python -m py_compile python/aero_service.py python/run_optimization.py python/reporting.py
      - name: Generate NeuralFoil polar
        run: |
          python python/aero_service.py \
            --backend neuralfoil --airfoil NACA2409 \
            --output "${RUNNER_TEMP}/aero_polar.csv"
          grep -q "# backend=neuralfoil" "${RUNNER_TEMP}/aero_polar.csv"
